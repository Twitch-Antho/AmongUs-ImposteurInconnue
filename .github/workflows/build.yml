name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AmongUsUnknownImpostors.sln

      - name: Build (Release)
        run: dotnet build AmongUsUnknownImpostors.sln -c Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsUnknownImpostors
          path: AmongUsUnknownImpostors/bin/Release/net6.0/AmongUsUnknownImpostors.dll
